# Local development stack. The IP allowlist is explicitly disabled here —
# in a container network there is no stable client address to allowlist, and
# leaving it enforcing would deny every request from your browser.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library-dev-password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      DATABASE_URL: postgres://library:library-dev-password@db:5432/library
      # Development only. Deployments must set a real secret; the API refuses
      # to start without one.
      JWT_SECRET: dev-only-secret-do-not-deploy
      PORT: 3001
      NODE_ENV: development
      IP_ALLOWLIST_MODE: disabled
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      # Unset on purpose: Vite proxies /api to the backend, so the browser
      # only ever talks to one origin in development.
      IP_ALLOWLIST_MODE: disabled
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
